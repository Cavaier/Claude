<script>
(function () {
  var root = (window.Shopify && Shopify.routes && Shopify.routes.root) || '/';
  document.querySelectorAll('.cv-cookies [data-cv-link]').forEach(function (a) { a.href = root + a.getAttribute('data-cv-link'); });
  var b = document.querySelector('.cv-cookies [data-cv-cookie-settings]');
  if (b) b.addEventListener('click', function (e) {
    if (window.privacyBanner && typeof window.privacyBanner.showPreferences === 'function') { e.preventDefault(); window.privacyBanner.showPreferences(); }
  });
})();
</script>
