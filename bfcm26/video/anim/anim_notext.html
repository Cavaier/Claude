<script>
const TL={"title": [0.35, "Black Friday wishlist"], "sub": 1.4449999999999998, "items": [[1.795, "The 3x stack, black, silver or gold", 3.5500000000000003], [3.87, "Waterproof, so it never comes off", 5.535], [5.855, "Case included", 6.62], [6.94, "Free shipping", 7.705], [8.025, "Tell him which finish", null]], "thumbs": [9.370000000000001, 9.570000000000002, 9.770000000000001], "btn": 10.170000000000002, "ch": 0.045};
const cl=(x)=>Math.max(0,Math.min(1,x));
function typed(start,txt,t){return txt.slice(0,Math.max(0,Math.floor((t-start)/TL.ch)));}
function setT(t){
  let caretAt=null;
  const [ts,tt]=TL.title; const s=typed(ts,tt,t);
  document.getElementById('title').textContent=s; if(t>=ts-0.3 && s.length<tt.length) caretAt='title';
  document.getElementById('sub').style.opacity=cl((t-TL.sub)/0.3);
  TL.items.forEach(([st,txt,ck],i)=>{
    document.getElementById('li'+i).style.opacity=cl((t-st+0.12)/0.12);
    const s2=typed(st,txt,t); document.getElementById('tx'+i).textContent=s2;
    if(t>=st && s2.length<txt.length) caretAt='tx'+i;
    if(i==TL.items.length-1 && t>=st) caretAt='tx'+i;
    if(ck!==null) document.getElementById('ck'+i).setAttribute('stroke-dashoffset',String(24*(1-cl((t-ck)/0.22))));
  });
  document.querySelectorAll('.caret').forEach(e=>e.remove());
  if(caretAt && Math.floor(t*2.2)%2==0 || (caretAt && typed(...(caretAt=='title'?[TL.title[0],TL.title[1]]:[0,'']),t).length>=0 && false)){}
  if(caretAt){const blink=(caretAt=='tx4' && typed(TL.items[4][0],TL.items[4][1],t).length==TL.items[4][1].length)? (Math.floor(t*2.2)%2==0):true; if(blink){const c=document.createElement('span');c.className='caret';document.getElementById(caretAt).appendChild(c);}}
  TL.thumbs.forEach((tt2,i)=>{const e=document.getElementById('th'+i);const p=cl((t-tt2)/0.35);e.style.opacity=p;e.style.transform='translateY('+(30*(1-p))+'px)';});
  const b=document.getElementById('btn');const pb=cl((t-TL.btn)/0.35);b.style.opacity=pb;b.style.transform='scale('+(0.94+0.06*pb)+')';
}
setT(0);
</script></body></html>
