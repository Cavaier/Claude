takeaways:
  - "Best send of the month was the women's 3x Set on a gap/fix angle ('One set closes the gap', 'Most women own zero. Here's the fix'): 12 orders, EUR 886.34, EUR 0.12173 per recipient. The next best was EUR 0.08372 (w36-her3x-closes-gap vs w37-him3x-put-together)."
  - "The same women's 3x Set lost on a statistic/education angle: '88% of women didn't know this' brought 2 orders, EUR 157.87 (w37-her3x-88pct-fact). The other send with the same 'Most jewelry isn't built to be worn every day' preview also came near the bottom: 3 orders, EUR 154.78 (w39-him3x-jewelry-facts). That one had a women's subject but linked to the men's set."
  - "Men's 3x Set: the identity angles earned the most ('Why do some guys always look put-together?' EUR 599.75 from 6 orders; 'One detail changed everything' EUR 458.18), while the 'detail' rewrites earned less ('The Detail You've Been Skipping' EUR 310.01; 'This Detail Changes Everything' EUR 236.88) (w37-him3x-put-together, w36-him3x-one-detail, w37-him3x-detail-skipping, w38-him3x-detail-changes)."
  - "The Duo Set was weak in September. 'Elevate Your Dressing Game' was the lowest-earning send of the month: 2 orders, EUR 129.69, EUR 0.02114 per recipient. The 29 Sep Duo send made EUR 395.46 to a larger audience that added the engaged-non-openers segment, and it had the month's highest unsubscribe rate, 0.01291 (w38-duo-dressing-game, w40-duo-elevate-everyday)."
  - "Open and click rates barely moved (opens 0.40624-0.44381, clicks 0.01061-0.01571) and did not track revenue. The highest-open send made EUR 339.51 (w36-her3x-detail-10s), while the lowest-click send (0.01061) made EUR 599.75 (w37-him3x-put-together). Judge Black Friday angles on orders and revenue per recipient, not on opens."
  - "Generic 'Elevate…/Less is more' subjects stayed mid-to-low: EUR 300.55, EUR 274.73 and EUR 129.69. The send that linked only to the for-her collection, with no hero product, made EUR 219.47 from 4 orders (w39-her3x-minimalism, w38-her3x-less-is-more, w38-duo-dressing-game, w39-her-collection-missing)."
