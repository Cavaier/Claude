takeaways:
  - "By product, 1-12 Oct (summed from the rows below, EUR): Duo Set 2 sends, 14 orders, EUR 915.43; women's 3x Set 3 sends, 11 orders, EUR 604.21; Minimal Cuff 1 send, 5 orders, EUR 363.35. In September the women's 3x Set led with 6 sends, 38 orders and EUR 2552.42, against 2 Duo sends with 9 orders and EUR 525.15 (w41-duo-everyday, w41-duo-detail-noticed, w40-her3x-fade, w41-her3x-gold-quiet, w41-her3x-trustpilot, w40-cuff-dressed-wrong)."
  - "The Duo Set is October's winner so far. Its two sends have the most orders (9, EUR 420.36), the highest click rate (0.01896) and the most revenue (EUR 495.07). The winning angles were the plain everyday-use pitch ('Two bracelets. Every day.') and the 'detail people notice', with a Trustpilot testimonial and 'packed to give' (w41-duo-everyday, w41-duo-detail-noticed)."
  - "The women's gold 3x Set lost all three times in October, at EUR 0.02794, 0.02601 and 0.025 per recipient, whether the angle was durability ('why your jewelry fades'), craft plus the buy-2 case offer, or Trustpilot social proof (w40-her3x-fade, w41-her3x-gold-quiet, w41-her3x-trustpilot). This is the reverse of its September high (perf:2026-09#w36-her3x-closes-gap)."
  - "The two gold 3x sends on 7 and 11 Oct had high click rates (0.01748, 0.01764), but clicks did not turn into orders: 4 and 2 orders (w41-her3x-gold-quiet, w41-her3x-trustpilot). The 11 Oct send also had the lowest open rate in either month (0.39573). The data doesn't say why. Check the landing page or offer before reusing these for Black Friday."
  - "The Minimal Cuff's one hero send made 5 orders and EUR 363.35, mid-pack. It isn't in config/products.yaml, so it can't be planned until it's added (w40-cuff-dressed-wrong)."
  - "Sends that added the engaged-non-openers segment had the highest unsubscribe rates: 0.00966 on 1 Oct, the highest in October, and 0.01291 on 29 Sep, the highest across both months. The 3 Oct send (0.00816) was inside the CORE-only range of 0.00619-0.00847. Weigh this before widening Black Friday sends to that segment (w40-cuff-dressed-wrong, w40-her3x-fade, perf:2026-09#w40-duo-elevate-everyday)."
